<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO Meta Tags -->
    <title>Luc Favre | Reporter &amp; Photojournalist</title>
    <meta
      name="description"
      content="Portfolio of Luc Favre. New York bred. Photojournalist. EST 1994. Explore photography and visual storytelling."
    />
    <meta
      name="keywords"
      content="Luc Favre, photography, photojournalist, New York, portfolio, visual arts"
    />
    <meta name="author" content="Luc Favre" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.25/dist/lenis.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="overflow-x-hidden antialiased text-[#151515]">

    <!-- Mobile fallback -->
    <div class="md:hidden flex h-screen w-screen items-center justify-center text-center p-8 text-2xl font-bold uppercase tracking-widest">
      Available only on desktop
    </div>

    <!-- Main content — desktop only -->
    <main class="w-full relative uppercase h-screen overflow-hidden md:block hidden">

      <header class="w-full fixed top-0 z-50">
        <nav class="w-full" aria-label="Main navigation">
          <ul class="flex w-full justify-between items-start p-4">
            <li class="overflow-hidden">
              <a
                href="/"
                aria-label="View work"
                class="uppercase header__link h-[8vh] relative overflow-hidden font-extrabold text-[2vw] lg:text-[1.8vw]"
              >
                <span class="header__link-text h-full w-full inline-block">WORK</span>
              </a>
            </li>
            <li class="flex flex-col justify-start overflow-hidden w-auto h-auto items-center">
              <a
                href="/"
                aria-label="Home - Luc Favre"
                class="uppercase header__link-title flex justify-start leading-[0.90] overflow-hidden font-extrabold text-[2vw]"
              >
                <span class="header__link-title-text inline-block">LUCFAVRE</span>
              </a>
              <p class="text-lg text-[1.5vw] overflow-hidden" aria-label="Biography summary">
                <span class="origin-top inline-block header__link-title-description">
                  New York ink. Photoreporter. EST 1994
                </span>
              </p>
            </li>
            <li class="overflow-hidden">
              <a
                href="/"
                aria-label="Information"
                class="uppercase header__link overflow-hidden font-extrabold text-[2vw] lg:text-[1.8vw]"
              >
                <span class="header__link-text h-full w-full inline-block">INFO</span>
              </a>
            </li>
          </ul>
        </nav>
      </header>

      <!-- Gallery cover — stacked images for Flip intro animation -->
      <section
        class="absolute hero__gallery-cover--before-animation inset-0 flex justify-center items-center translate-y-1/2 -top-[5vh] left-1/2 -translate-x-[45%] w-[50vw] lg:w-[15vw] h-[40vh]"
        aria-label="Photography gallery"
      >
        <figure class="absolute hero__gallery-cover-image isolate m-0">
          <img
            src="https://i.pinimg.com/736x/13/55/3b/13553b57b5f7a9f98a5a56bcec196676.jpg"
            alt="Press cover 01 — Luc Favre"
            class="block w-auto h-auto max-h-[30vh] max-w-[50vw] lg:max-w-[15vw]"
          />
          <figcaption class="sr-only">Press cover 01</figcaption>
        </figure>

        <figure class="absolute hero__gallery-cover-image isolate m-0">
          <img
            src="https://i.pinimg.com/736x/e3/c1/51/e3c151dec3e48d267fd9ffe9dc2e8f38.jpg"
            alt="Press cover 02 — Luc Favre"
            class="block w-auto h-auto max-h-[30vh] max-w-[50vw] lg:max-w-[15vw]"
          />
          <figcaption class="sr-only">Press cover 02</figcaption>
        </figure>

        <figure class="absolute hero__gallery-cover-image isolate m-0">
          <img
            src="https://i.pinimg.com/736x/32/29/a5/3229a529e29ef6b3b26d2b50716a8e29.jpg"
            alt="Press cover 03 — Luc Favre"
            class="block w-auto h-auto max-h-[30vh] max-w-[50vw] lg:max-w-[15vw]"
          />
          <figcaption class="sr-only">Press cover 03</figcaption>
        </figure>

        <figure class="absolute hero__gallery-cover-image isolate m-0">
          <img
            src="https://i.pinimg.com/1200x/51/8e/5b/518e5bec9dfd2c5f332eed512ed3f2da.jpg"
            alt="Press cover 04 — Luc Favre"
            class="block w-auto h-auto max-h-[30vh] max-w-[50vw] lg:max-w-[15vw]"
          />
          <figcaption class="sr-only">Press cover 04</figcaption>
        </figure>

        <figure class="absolute hero__gallery-cover-image isolate m-0">
          <img
            src="https://i.pinimg.com/1200x/17/1e/11/171e11f9dd29fafd4da4f5e614589d2f.jpg"
            alt="Press cover 05 — Luc Favre"
            class="block w-auto h-auto max-h-[30vh] max-w-[50vw] lg:max-w-[15vw]"
          />
          <figcaption class="sr-only">Press cover 05</figcaption>
        </figure>

        <figure class="absolute hero__gallery-cover-image isolate m-0">
          <img
            src="https://i.pinimg.com/1200x/e6/0e/6f/e60e6f478504af6cb3ee3b2be7b7913b.jpg"
            alt="Press cover 06 — Luc Favre"
            class="block w-auto h-auto max-h-[30vh] max-w-[50vw] lg:max-w-[15vw]"
          />
          <figcaption class="sr-only">Press cover 06</figcaption>
        </figure>

        <figure class="absolute hero__gallery-cover-image isolate m-0">
          <img
            src="https://i.pinimg.com/1200x/ed/12/2e/ed122ee06373782b88f09cca58911969.jpg"
            alt="Press cover 07 — Luc Favre"
            class="block w-auto h-auto max-h-[30vh] max-w-[50vw] lg:max-w-[15vw]"
          />
          <figcaption class="sr-only">Press cover 07</figcaption>
        </figure>

        <figure class="absolute hero__gallery-cover-image isolate m-0">
          <img
            src="https://i.pinimg.com/1200x/ac/8f/c4/ac8fc464e41d1d82193c19935c9e4e10.jpg"
            alt="Press cover 08 — Luc Favre"
            class="block w-auto h-auto max-h-[30vh] max-w-[50vw] lg:max-w-[15vw]"
          />
          <figcaption class="sr-only">Press cover 08</figcaption>
        </figure>
      </section>

      <!-- Final carousel target container -->
      <section
        class="hero h-screen w-full absolute top-0 p-4 left-0 flex justify-end items-end pointer-events-none"
        aria-hidden="true"
      >
        <div
          class="hero__gallery-cover-container min-h-screen w-full flex-nowrap items-end justify-end flex gap-4 pointer-events-auto"
        ></div>
      </section>

    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/Flip.min.js" defer></script>
    <script src="https://unpkg.com/lenis@1.3.25/dist/lenis.min.js" defer></script>
    <script src="./main.js" defer></script>
  </body>
</html>
