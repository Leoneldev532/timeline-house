<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leonel NextStep - Photographer</title>
    <meta
      name="description"
      content="Leonel NextStep, Photographer from France based in Paris. Beauty and fashion photography."
    />
    <meta name="robots" content="index, follow" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Volkhov:ital,wght@0,400;0,700;1,400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "me";
        src: url("./font/Bulevar-Regular.9f86a6f.woff");
      }

      @font-face {
        font-family: "mo";
        src: url("./font/NeueMontreal-Light.fb5714d") format("woff2");
      }

      h1,
      h2,
      h3,
      h4 {
        font-family: "me", sans-serif;
      }

      span,
      p {
        font-family: "mo", sans-serif;
      }

      .transparent {
        transition: all 0.3s ease-in-out;
        background: transparent;
      }

      h1 span {
        font-family: "me", sans-serif;
      }
    </style>
  </head>

  <body>
    <main class="main h-full w-full relative overflow-hidden">
      <div
        class="hero h-[100vh] w-full relative bg-black flex justify-center items-center overflow-hidden"
      >
        <div
          class="hero_loading-items h-full w-full px-8 flex justify-center gap-8 items-center relative"
        >
          <span
            class="hero_loading-text hero_loading-text-relative relative will-change-transform text-white mr-8"
            >Loading</span
          >

          <div
            class="overflow-hidden will-change-transform hero_container-max hero_container-max-mask absolute z-20 top-0 left-0 mask-no-repeat mask-center mask-[url('data:image/svg+xml,%3Csvg%20width%3D%2224%22%20height%3D%2222%22%20viewBox%3D%220%200%2024%2022%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M23.9985%200C13.6487%205.75593%2010.3483%205.75593%201.90735e-06%20-1.04907e-06C6.2773%209.48652%206.2773%2012.5135%209.45698e-07%2022C10.3498%2016.2455%2013.6502%2016.2455%2024%2022C17.7212%2012.5135%2017.7212%209.4879%2023.9985%200Z%22%20fill%3D%22black%22%2F%3E%3C%2Fsvg%3E')] h-full w-full [-webkit-mask-image:url('data:image/svg+xml,%3Csvg%20width%3D%2224%22%20height%3D%2222%22%20viewBox%3D%220%200%2024%2022%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M23.9985%200C13.6487%205.75593%2010.3483%205.75593%201.90735e-06%20-1.04907e-06C6.2773%209.48652%206.2773%2012.5135%209.45698e-07%2022C10.3498%2016.2455%2013.6502%2016.2455%2024%2022C17.7212%2012.5135%2017.7212%209.4879%2023.9985%200Z%22%20fill%3D%22black%22%2F%3E%3C%2Fsvg%3E')] [-webkit-mask-repeat:no-repeat] [-webkit-mask-position:center] [-webkit-mask-size:8%_8%]"
          >
            <div
              class="hero_container-inner h-full w-full relative p-6 lg:p-8 bg-white"
            >
              <div
                class="hero_content flex lg:flex-row flex-col justify-between relative w-full items-start"
              >
                <h1 class="hero_title max-w-1/2 leading-[0.8] inline-block">
                  <span
                    class="hero_title-part hero_title-part-1 inline-block text-[16vw] overflow-hidden"
                  >
                    <span
                      class="hero-title-part-1-txt will-change-transform inline-block"
                      >LEONEL</span
                    >
                  </span>
                  <span
                    class="hero_title-part hero_title-part-2 text-[16vw] inline-block overflow-hidden"
                  >
                    <span
                      class="hero-title-part-2-txt will-change-transform inline-block"
                    >
                      NEXTSTEP</span
                    >
                  </span>
                </h1>

                <div
                  class="hero_bio flex uppercase text-xs leading-[1.2] lg:text-base flex-col"
                >
                  <span
                    class="hero_bio-item hero_bio-item-1 inline-block hero-txt-animated-opacity"
                    >PHOTOGRAPHER from
                  </span>

                  <span
                    class="hero_bio-item hero_bio-item-2 inline-block hero-txt-animated-opacity"
                    >FRANCE based in paris
                  </span>
                </div>

                <div
                  class="hero_update flex uppercase text-xs leading-[1.2] lg:text-base flex-col"
                >
                  <span
                    class="hero_update-item hero_update-item-1 inline-block hero-txt-animated-opacity"
                    >Last Update
                  </span>
                  <span
                    class="hero_update-item hero_update-item-2 inline-block hero-txt-animated-opacity"
                    >Feb 2025
                  </span>
                </div>

                <nav
                  class="hero_nav flex uppercase font-medium flex-col"
                  aria-label="Navigation principale"
                >
                  <ul class="hero_nav-list flex text-xl gap-4">
                    <li class="hero_nav-item">
                      <a href="#index" class="hover:opacity-50">INDEX</a>
                    </li>
                    <li class="hero_nav-item">
                      <a href="#work" class="hover:opacity-50">WORK</a>
                    </li>
                    <li class="hero_nav-item">
                      <a href="#gallery" class="hover:opacity-50">GALLERY</a>
                    </li>
                    <li class="hero_nav-item">
                      <a href="#about" class="hover:opacity-50">ABOUT</a>
                    </li>
                  </ul>
                </nav>

                <p
                  class="hero_copyright hero_copyright-hidden top-[10%] leading-[1] block text-xs md:hidden mt-4 relative"
                  aria-hidden="true"
                >
                  <span
                    class="hero_copyright-line hero_copyright-line-1 overflow-hidden uppercase block"
                  >
                    <span
                      class="hero_copyright-text inline-block will-change-transform text-anim-hero"
                      >All pictures on this site are</span
                    >
                  </span>
                  <span
                    class="hero_copyright-line hero_copyright-line-2 overflow-hidden uppercase block"
                  >
                    <span
                      class="hero_copyright-text inline-block will-change-transform text-anim-hero"
                      >protected by copyright</span
                    >
                  </span>
                </p>
              </div>

              <div
                class="hero_images hero_images-container absolute pointer-events-none top-0 z-0 left-0 w-full h-[100vh]"
              >
                <div
                  class="hero_image-wrapper hero_image-wrapper-1 w-1/2 lg:w-1/4 h-[50vh] lg:h-[80vh] absolute bottom-0 left-[55%] lg:left-[73.50%]"
                >
                  <img
                    class="hero_image hero_image-1 w-full h-full object-cover"
                    src="https://i.pinimg.com/1200x/5c/fa/d6/5cfad66af87b5505a6cf41cbf534f190.jpg"
                    alt="Œuvre photographique par Leonel NextStep"
                  />
                </div>

                <p
                  class="hero_copyright hero_copyright-visible top-[10%] md:block hidden relative lg:top-[65%] left-[50%] lg:left-[25%]"
                >
                  <span
                    class="hero_copyright-line hero_copyright-line-3 overflow-hidden uppercase block"
                  >
                    <span
                      class="hero_copyright-text inline-block will-change-transform text-anim-hero"
                      >All pictures on this site are</span
                    >
                  </span>
                  <span
                    class="hero_copyright-line hero_copyright-line-4 overflow-hidden uppercase block"
                  >
                    <span
                      class="hero_copyright-text inline-block will-change-transform text-anim-hero"
                      >protected by copyright</span
                    >
                  </span>
                </p>

                <div
                  class="hero_image-wrapper hero_image-wrapper-2 w-1/2 md:w-1/3 lg:w-1/5 h-[34vh] absolute bottom-0 left-0 lg:left-[2%]"
                >
                  <img
                    class="hero_image hero_image-2 h-full w-full object-cover"
                    src="https://i.pinimg.com/736x/28/a2/c1/28a2c19765f2896cea54fed0203b5260.jpg"
                    alt="Photographie de mode par Leonel NextStep"
                  />
                </div>
              </div>
            </div>
          </div>

          <div
            class="hero_loading-pourcentage-container ml-8 w-16 text-right will-change-transform relative border px-3 py-1.5 rounded-full text-white"
          >
            <span class="hero_loading-pourcentage"> 00% </span>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
